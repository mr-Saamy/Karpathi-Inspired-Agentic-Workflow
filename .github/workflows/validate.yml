name: Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run universal validation suite
        run: ./scripts/validate-all.sh

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Antigravity IDE PowerShell installer test
        run: powershell -ExecutionPolicy Bypass -File '.\Antigravity IDE\scripts\test-install.ps1'
      - name: Run GitHub Copilot PowerShell installer test
        run: powershell -ExecutionPolicy Bypass -File '.\Github Copilot\scripts\test-install.ps1'
      - name: Run Zed Editor PowerShell installer test
        run: powershell -ExecutionPolicy Bypass -File '.\Zed\scripts\test-install.ps1'
      - name: Run VSCodium PowerShell installer test
        run: powershell -ExecutionPolicy Bypass -File '.\VSCodium\scripts\test-install.ps1'
      - name: Run Terminal & CLI PowerShell installer test
        run: powershell -ExecutionPolicy Bypass -File '.\Terminal\scripts\test-install.ps1'
